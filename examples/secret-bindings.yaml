# Secret Bindings Example
#
# This example demonstrates declarative secret bindings in a workflow.
# Workflows declare logical secret requirements on steps via `execution.secrets`.
# An execution environment document (such as `examples/.conductor/environments/secrets-demo.yaml`)
# binds those logical secret names to credential sources (such as host environment variables)
# and enforces consumer access policies.
#
# Usage:
#   # Run with the secrets-demo environment (requires DEMO_SECRET to be set)
#   DEMO_SECRET=topsecret conductor run examples/secret-bindings.yaml --environment secrets-demo
#
#   # Validate against the secrets-demo environment
#   conductor validate examples/secret-bindings.yaml --environment secrets-demo
#

workflow:
  name: secret-bindings-demo
  description: Demonstrates declarative secret bindings delivered to a script step
  version: "1.0.0"
  entry_point: verify_secret

  limits:
    max_iterations: 5

agents:
  - name: verify_secret
    type: script
    description: Verify that the delivered secret environment variable is present and non-empty
    execution:
      profile: shell
      secrets:
        - ref: demo_secret
          scope: script
          delivery:
            env: INJECTED_SECRET
    command: python3
    args:
      - "-c"
      - |
        import os, sys
        val = os.environ.get("INJECTED_SECRET", "")
        if not val:
            print("ERROR: INJECTED_SECRET is empty or unset", file=sys.stderr)
            sys.exit(1)
        print("SUCCESS: Secret was injected securely via environment binding")
    routes:
      - to: $end
        when: "exit_code == 0"
      - to: handle_error

  - name: handle_error
    type: script
    description: Handle missing secret error
    command: python3
    args:
      - "-c"
      - |
        print("Secret verification failed")
    routes:
      - to: $end

output:
  result: "{% if verify_secret is defined %}{{ verify_secret.output.stdout | trim }}{% else %}Failed{% endif %}"
